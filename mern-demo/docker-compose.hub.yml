services:
  backend:
    image: krma415/mern-backend:1.0
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      PORT: 5000

  frontend:
    image: krma415/mern-frontend:2.0
    ports:
      - "5173:5173"
    depends_on:
      - backend
